name: DriverMasterPro CI

on:
  push:
    branches:
      - feature/v0.2-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: drivermasterpro-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows / .NET 10 / Release)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print checked-out commit identity
        shell: pwsh
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkedOut = (git rev-parse HEAD).Trim()
          Write-Host "Event name:        $env:GITHUB_EVENT_NAME"
          Write-Host "GITHUB_SHA:        $env:GITHUB_SHA"
          Write-Host "GITHUB_REF:        $env:GITHUB_REF"
          Write-Host "Checked-out SHA:   $checkedOut"
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            Write-Host "PR head SHA:       $env:PR_HEAD_SHA"
            Write-Host "PR base SHA:       $env:PR_BASE_SHA"
            Write-Host "PR head ref:       $env:PR_HEAD_REF"
            Write-Host "PR base ref:       $env:PR_BASE_REF"
          }
          git --no-pager log -1 --format="Commit: %H%nAuthor: %an%nDate:   %ci%nSubject: %s"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: .NET info
        run: dotnet --info

      - name: Restore application and tests
        run: dotnet restore .\tests\DriverMasterPro.Tests\DriverMasterPro.Tests.csproj

      - name: Build application (Release)
        run: dotnet build .\DriverMasterPro.csproj --configuration Release --no-restore

      - name: Build test project (Release)
        run: dotnet build .\tests\DriverMasterPro.Tests\DriverMasterPro.Tests.csproj --configuration Release --no-restore

      - name: Execute automated tests (Release)
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsDirectory = Join-Path $env:RUNNER_TEMP ("DriverMasterPro-TestResults-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $resultsDirectory -Force | Out-Null

          dotnet test .\tests\DriverMasterPro.Tests\DriverMasterPro.Tests.csproj `
            --configuration Release --no-build --no-restore `
            --filter "Category!=WmiIntegration" `
            --results-directory $resultsDirectory `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=automated-tests.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test failed with exit code $LASTEXITCODE."
          }

          $trxPath = Join-Path $resultsDirectory 'automated-tests.trx'
          if (-not (Test-Path $trxPath)) {
            throw "Test result file was not produced: $trxPath"
          }

          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if ($null -eq $counters) {
            throw "Test result file has no execution counters."
          }

          $total = [int]$counters.GetAttribute('total')
          $passed = [int]$counters.GetAttribute('passed')
          $failed = [int]$counters.GetAttribute('failed')
          $notExecuted = [int]$counters.GetAttribute('notExecuted')
          Write-Host "CI test results: total=$total passed=$passed failed=$failed skipped=$notExecuted"
          if ($total -le 0 -or $passed -ne $total -or $failed -ne 0) {
            throw "Test result gate failed: require at least one test, all tests passed, and no failures or skips."
          }